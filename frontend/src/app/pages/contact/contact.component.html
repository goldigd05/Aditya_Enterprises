<section class="page-header">
  <div class="container">
    <span class="section-label">Get In Touch</span>
    <h1>Contact Aditya Enterprises</h1>
    <p>Have a question or need a quotation? Fill out the form below or reach us directly.</p>
  </div>
</section>

<section class="section contact-page">
  <div class="container contact-page__grid">
    <div class="contact-page__info">
      <h2 class="section-title">Contact Information</h2>
      <div class="contact-page__item" *ngFor="let item of contactInfo">
        <span class="contact-page__icon">{{ item.icon }}</span>
        <div>
          <strong>{{ item.label }}</strong>
          <p>{{ item.value }}</p>
        </div>
      </div>

      <!-- <div class="contact-page__map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3768.0!2d72.8777!3d19.0760!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1"
          width="100%" height="240" style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
      </div> -->
    </div>

    <div class="contact-page__form">
      <h2 class="section-title">Send Us A Message</h2>
      <app-contact-form></app-contact-form>
    </div>
  </div>
</section>
