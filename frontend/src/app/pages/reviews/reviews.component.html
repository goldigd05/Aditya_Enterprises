<section class="page-header">
  <div class="container">
    <span class="section-label">Testimonials</span>
    <h1>What Our Customers Say</h1>
    <p>Real feedback from builders, contractors and homeowners who trust Aditya Enterprises.</p>

    <div class="page-header__rating">
      <strong>{{ averageRating }}</strong>
      <span>/ 5 Average Rating from {{ reviews.length }} Reviews</span>
    </div>
  </div>
</section>

<app-stats></app-stats>

<section class="section reviews-page">
  <div class="container">
    <div class="reviews-page__grid">
      <app-review-card *ngFor="let review of reviews" [review]="review"></app-review-card>
    </div>
  </div>
</section>
