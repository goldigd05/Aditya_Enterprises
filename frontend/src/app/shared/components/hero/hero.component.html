<section class="hero" @heroAnim>
  <div class="container hero__inner">
    <div class="hero__content">
      <span style="font-size: 28px;">Aditya Enterprises</span>
      <h1 class="anim-item">Premium Architectural <span>Hardware Solutions</span></h1>
      <p class="anim-item">High Quality Door Hardware Accessories with Trusted Service and Reliable Support.</p>
      <div class="hero__actions anim-item">
        <a routerLink="/products" class="btn btn-primary">Explore Products</a>
        <a routerLink="/contact" class="btn btn-outline">Contact Us</a>
      </div>
    </div>

    <div class="hero__image anim-item">
      <img src="assets/images/hero-hardware.jpg" alt="Modern Door Hardware" />
      <div class="hero__image-badge">
        <strong>10+</strong>
        <span>Years of Trust</span>
      </div>
    </div>
  </div>
</section>
